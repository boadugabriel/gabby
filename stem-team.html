<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEM Team - ANSEC</title>
  <link rel="stylesheet" href="layout3.css">
</head>
<body>
  <ansec-header-component></ansec-header-component>

  <section class="content">
    <h1>STEM Team</h1>
    <div class="accordion">
      <!-- Projects -->
      <div class="accordion-item">
        <button class="accordion-header">Projects</button>
        <div class="accordion-body">
          <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/STEM_project.jpg" alt="STEM Project">
        </div>
      </div>

      <!-- Competitions -->
      <div class="accordion-item">
        <button class="accordion-header">Competitions</button>
        <div class="accordion-body">
          <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Science_fair.jpg" alt="Science Fair">
        </div>
      </div>

      <!-- Team Members -->
      <div class="accordion-item">
        <button class="accordion-header">Team Members</button>
        <div class="accordion-body">
          <img src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Students_teamwork.jpg" alt="STEM Team Members">
        </div>
      </div>
    </div>

    <!-- Back to Gallery -->
    <button onclick="location.href='gallery.html'" class="back-btn">⬅ Back to Gallery</button>
  </section>

  <ansec-footer-component></ansec-footer-component>
  <script src="script.js"></script>
</body>
</html>
