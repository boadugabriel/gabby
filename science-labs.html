<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Science Labs - ANSEC</title>
  <link rel="stylesheet" href="layout3.css">
</head>
<body>

  <section class="content">
    <h1>Science Labs</h1>
    <div class="accordion">
      <div class="accordion-item">
        <button class="accordion-header">Physics Lab</button>
        <div class="accordion-body">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/0c/Physics_lab.jpg" alt="Physics Lab">
        </div>
      </div>
      <div class="accordion-item">
        <button class="accordion-header">Chemistry Lab</button>

        </div>
      </div>
      <div class="accordion-item">
        <button class="accordion-header">Biology Lab</button>
        <div class="accordion-body">
          <img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Biology_lab.jpg" alt="Biology Lab">
        </div>
      </div>
    </div>
    <button onclick="location.href='gallery.html'" class="back-btn">⬅ Back to Gallery</button>

  <ansec-footer-component></ansec-footer-component>
