<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - ANSEC</title>
  <link rel="stylesheet" href="layout3.css">
</head>
<body>
  <ansec-header-component></ansec-header-component>

  <section class="content">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you! Reach out to Anum Presbyterian Senior High (ANSEC) using the details below.</p>

    <h2>Address</h2>
    <p>Anum Presbyterian Senior High School<br>
       P.O. Box 123, Anum, Eastern Region, Ghana</p>

    <h2>Phone</h2>
    <p>+233 (0) 24 123 4567</p>

    <h2>Email</h2>
    <p>info@ansec.edu.gh</p>

    <h2>Send Us a Message</h2>
    <form class="contact-form" onsubmit="return submitForm(event)">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>

    <h2>Location Map</h2>
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3910.123456789!2d-0.123456!3d6.123456!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x123456789abcdef!2sAnum%20Presbyterian%20Senior%20High%20School!5e0!3m2!1sen!2sgh!4v1670000000000"
      width="100%" height="350" style="border:0;" allowfullscreen="" loading="lazy">
    </iframe>
  </section>

  <ansec-footer-component></ansec-footer-component>

  <script src="script.js"></script>

</body>
</html>
